# Production compose for Timeweb Apps "Docker Compose" environment.
# All images are pre-built by CI and pulled from GHCR.
# pgvector schema is initialized by aicoach entrypoint (db/init_db.py).
#
# Designed for a FRESH Timeweb application instance with a virgin persistent
# volume. On first boot the postgres image runs initdb against an empty data
# directory, honors POSTGRES_DB=aicoach, and creates the database before
# aicoach connects — so the entire 'database "aicoach" does not exist' loop
# we hit on the previous instance cannot reproduce here.

services:
  web:
    # Pinned to nginx Survey/* + dashboard hardening fix (web PR #63,
    # main 0245152, 2026-05-26): adds Survey + AiReportConfig +
    # CoachBranding + CoachLead + CoachService to the nginx API regex
    # (Survey misroute was crashing /app/dashboard via ErrorBoundary),
    # plus EarningsBannerCard guard and apiClient text/html guard.
    # Digest pinning forces Timeweb's host-side image cache to fetch a
    # manifest it doesn't have — bare :latest is unreliable on this host.
    image: ghcr.io/oxord/fitness-together-web@sha256:213e8b19baa69fa3e8f6bcc886de465d9c74d9454001e158b6edcfb2f22f6f39
    pull_policy: always
    # Timeweb Apps reserves host ports 80/443 for its edge gateway (TLS
    # termination + forwarding). The sanitizer rejects host port 80 with
    # "Port 80 is reserved for internal use". Bind to 8080 instead and
    # set "Application port" = 8080 in the Timeweb Apps panel so external
    # traffic is routed here.
    ports:
      - "8080:80"
    networks:
      - ft-network
    depends_on:
      webapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  webapi:
    # Pinned to fix(workout): coach-only scheduled workouts no longer 500
    # (backend PR #56, release/v1.0 8da4af7, 2026-05-27).
    image: ghcr.io/oxord/fitness-together-webapi@sha256:475f247f16efe62c504d38a30df29623fb6f9c20d97e2bc5de3cbed111ec6f80
    pull_policy: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${FT_DB_CONNECTION_STRING}
      - token__issuer=${JWT_ISSUER:-FitnessTogetherTeam}
      - token__subject=${JWT_SUBJECT:-AdminTokens}
      - token__audience=${JWT_AUDIENCE:-FitnessTogetherClient}
      - token__key=${JWT_KEY}
      - EmailSettings__SmtpUser=${EMAIL_SMTP_USER}
      - EmailSettings__SmtpPass=${EMAIL_SMTP_PASS}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - AiCoach__BaseUrl=http://aicoach:8000
      - AiCoach__AuthToken=${AICOACH_AUTH_TOKEN}
      - AiCoach__TimeoutSeconds=90
      - YooKassa__ShopId=${YOOKASSA_SHOP_ID}
      - YooKassa__SecretKey=${YOOKASSA_SECRET_KEY}
      - YooKassa__ReturnUrl=${YOOKASSA_RETURN_URL:-https://fitness-together.ru/billing/success}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - DOTNET_gcServer=0
    networks:
      - ft-network
    depends_on:
      aicoach:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  aicoach:
    image: ghcr.io/oxord/fitness-together-aicoach:latest
    pull_policy: always
    depends_on:
      aipg:
        condition: service_started
    environment:
      PG_HOST: aipg
      PG_PORT: 5432
      PG_DATABASE: aicoach
      PG_USER: aicoach
      PG_PASSWORD: ${AICOACH_PG_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-chat}
      AICOACH_AUTH_TOKEN: ${AICOACH_AUTH_TOKEN}
      AICOACH_LOG_TO_STDOUT: "true"
    networks:
      - ft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  aipg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aicoach
      POSTGRES_USER: aicoach
      POSTGRES_PASSWORD: ${AICOACH_PG_PASSWORD}
    networks:
      - ft-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  ft-network:
    driver: bridge
