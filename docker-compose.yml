# Production compose for Timeweb Apps "Docker Compose" environment.
# All images are pre-built by CI and pulled from GHCR.
# Volumes are not used (not supported by Timeweb Apps platform).
# pgvector schema is initialized by aicoach entrypoint (db/init_db.py).
#
# IMPORTANT: PG_DATABASE for aicoach and POSTGRES_DB for aicoach-postgres are
# both pinned to 'postgres' (the always-present system DB). If Timeweb's
# dashboard env-vars panel has a PG_DATABASE or POSTGRES_DB override set to
# anything else (e.g. 'aicoach'), DELETE those overrides — they will mask
# this compose value and reintroduce the 'database "aicoach" does not exist'
# log spam, since the postgres image only honors POSTGRES_DB on a virgin
# data dir, which Timeweb persists across redeploys.

services:
  web:
    image: ghcr.io/oxord/fitness-together-web:latest
    pull_policy: always
    # Timeweb Apps reserves host ports 80/443 for its edge gateway (TLS
    # termination + forwarding). The sanitizer rejects host port 80 with
    # "Port 80 is reserved for internal use". Bind to 8080 instead and
    # set "Application port" = 8080 in the Timeweb Apps panel so external
    # traffic is routed here.
    ports:
      - "8080:80"
    networks:
      - ft-network
    depends_on:
      webapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  webapi:
    image: ghcr.io/oxord/fitness-together-webapi:latest
    pull_policy: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${FT_DB_CONNECTION_STRING}
      - token__issuer=${JWT_ISSUER:-FitnessTogetherTeam}
      - token__subject=${JWT_SUBJECT:-AdminTokens}
      - token__audience=${JWT_AUDIENCE:-FitnessTogetherClient}
      - token__key=${JWT_KEY}
      - EmailSettings__SmtpUser=${EMAIL_SMTP_USER}
      - EmailSettings__SmtpPass=${EMAIL_SMTP_PASS}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - AiCoach__BaseUrl=http://aicoach:8000
      - AiCoach__AuthToken=${AICOACH_AUTH_TOKEN}
      - AiCoach__TimeoutSeconds=90
      - YooKassa__ShopId=${YOOKASSA_SHOP_ID}
      - YooKassa__SecretKey=${YOOKASSA_SECRET_KEY}
      - YooKassa__ReturnUrl=${YOOKASSA_RETURN_URL:-https://fitness-together.ru/billing/success}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - DOTNET_gcServer=0
    networks:
      - ft-network
    depends_on:
      aicoach:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  aicoach:
    image: ghcr.io/oxord/fitness-together-aicoach@sha256:e65437a6a519ae6bce64f6098fbe3d805b2139e2c3b468da473d7024ca3be84a
    depends_on:
      aicoach-postgres:
        condition: service_started
    environment:
      PG_HOST: aicoach-postgres
      PG_PORT: 5432
      # Use the always-present 'postgres' system DB instead of a custom DB.
      # POSTGRES_DB on the postgres image only runs initdb on a virgin data
      # dir; if Timeweb persisted any prior state, our 'aicoach' DB never gets
      # created and every connection logs FATAL: database does not exist.
      # Sticking to 'postgres' sidesteps that entire failure mode — we still
      # get our own user, table, and pgvector extension, just inside a DB that
      # is guaranteed to exist on any running postgres instance.
      PG_DATABASE: postgres
      PG_USER: aicoach
      PG_PASSWORD: ${AICOACH_PG_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-chat}
      AICOACH_AUTH_TOKEN: ${AICOACH_AUTH_TOKEN}
      AICOACH_LOG_TO_STDOUT: "true"
    networks:
      - ft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  aicoach-postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Force POSTGRES_DB to the system 'postgres' DB. Without this, the
      # postgres image defaults POSTGRES_DB=POSTGRES_USER=aicoach, which
      # only takes effect on a virgin data dir; under Timeweb's persistent
      # state we keep losing that DB and flooding logs with
      # "database aicoach does not exist". Targeting the always-present
      # 'postgres' DB sidesteps that entire failure mode.
      POSTGRES_DB: postgres
      POSTGRES_USER: aicoach
      POSTGRES_PASSWORD: ${AICOACH_PG_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicoach"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - ft-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  ft-network:
    driver: bridge
